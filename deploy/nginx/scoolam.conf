# Nginx reverse proxy for scoolam.com → Next.js app.
#
# Install:
#   sudo cp deploy/nginx/scoolam.conf /etc/nginx/sites-available/scoolam
#   sudo ln -s /etc/nginx/sites-available/scoolam /etc/nginx/sites-enabled/scoolam
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (after DNS points scoolam.com to the VPS):
#   sudo certbot --nginx -d scoolam.com -d www.scoolam.com
#   certbot will rewrite the server blocks below to add the 443 listener + certs.

# Force www → apex (optional; remove this block if you prefer www as primary).
server {
    listen 80;
    listen [::]:80;
    server_name www.scoolam.com;
    return 301 https://scoolam.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name scoolam.com;

    # certbot will add the 443 ssl block on top of this. Keep the location
    # blocks below so the certbot-managed server inherits them.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket + long-lived connections (better-auth, streaming).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Larger body for content uploads (worksheets, infographics).
    client_max_body_size 25m;
}
